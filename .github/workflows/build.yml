name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build natively for aarch64 inside an emulated arm64 container. glib comes from the
      # distro; the only Sailfish-specific deps (libgbinder, libglibutil) are vendored in
      # ./vendor, pinned to a Sailfish OS release, so the binary is ABI-matched to the device.
      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build + unit-test (native aarch64)
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD":/work -w /work \
            arm64v8/ubuntu:24.04 bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                gcc make pkg-config file libglib2.0-dev
              make MODE=vendored-release CROSS=
              file appsupport-bridge-bt
              make MODE=vendored-release test
            '

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: appsupport-bridge-bt-aarch64
          path: appsupport-bridge-bt
          if-no-files-found: error

      - name: Prepare release assets
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: cp appsupport-bridge-bt abbr

      - name: Publish latest release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Rolling build from `main` (`${{ github.sha }}`).

            Download `abbr` and `run-temp.sh`, copy both to the phone under `/home/defaultuser/`, then:

            ```sh
            devel-su sh run-temp.sh
            ```
          files: |
            abbr
            run-temp.sh
          overwrite_files: true
          make_latest: true
